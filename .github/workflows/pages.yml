name: Website

# Builds the docs (site/, VitePress) and publishes them to GitHub Pages, at webframe.tw050x.net,
# whenever they change on master, or by hand. Needs Pages turned on with "GitHub Actions" as its
# source and webframe.tw050x.net as its custom domain (Settings → Pages), and a CNAME record for
# webframe.tw050x.net pointing at tw050x.github.io. site/public/CNAME holds the domain too.
on:
  push:
    branches: [master]
    paths: [site/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the docs
        run: npm run docs:build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/.vitepress/dist
      - id: deployment
        uses: actions/deploy-pages@v4
