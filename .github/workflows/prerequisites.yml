name: Prerequisites

# Everything that must pass before a release: the packages build, their types check
# (test/types), and the tests pass. The docs must build too.
on:
  push:

jobs:
  prerequisites:
    name: Prerequisites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test
        run: npm test
      - name: Build the docs
        run: npm run docs:build
